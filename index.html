<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEN Bank | Central Ledger</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --accent: #00ff88; --bg: #0a0a0a; --panel: #111; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .ledger-card { background: var(--panel); border: 1px solid #222; padding: 40px; border-radius: 24px; width: 100%; max-width: 400px; margin-top: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .balance { font-size: 3.2rem; font-weight: 800; color: var(--accent); margin: 15px 0; letter-spacing: -1px; }
        .status-pill { display: inline-block; padding: 6px 16px; border-radius: 50px; font-size: 11px; font-weight: 700; background: #1a1a1a; color: #555; border: 1px solid #333; text-transform: uppercase; }
        .status-pill.online { color: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px rgba(0,255,136,0.2); }
        .history-list { width: 100%; max-width: 400px; margin-top: 30px; }
        .item { background: var(--panel); margin-bottom: 8px; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #222; }
        .debit { color: #ff4444; font-weight: 600; }
        .credit { color: var(--accent); font-weight: 600; }
        .label { color: #666; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="ledger-card">
    <div id="status" class="status-pill">Synchronizing...</div>
    <div class="label" style="margin-top: 25px;">Available Liquidity</div>
    <div class="balance" id="balance">₹0.00</div>
    <div style="color: #444; font-size: 13px;">ID: pranshi_main</div>
</div>

<div class="history-list" id="history-container">
    <div class="label" style="margin-bottom: 15px;">Transaction History</div>
    <div id="history-content">
        </div>
</div>

<script>
    // --- DATABASE CONFIGURATION ---
    // Full operational matrix attached to maintain handshake stability without dropping WebSocket frames
    const firebaseConfig = {
        apiKey: "AIzaSyDL7CPrwuAw-BrIPHQuNtydc1h1g73sFVk",
        authDomain: "centrol-bank.firebaseapp.com",
        databaseURL: "https://centrol-bank-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "centrol-bank",
        storageBucket: "centrol-bank.firebasestorage.app",
        messagingSenderId: "577293119465",
        appId: "1:577293119465:web:1a6f72747c56be845ca578"
    };
    
    // Initialize Firebase properly
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    
    const db = firebase.database();
    const userId = "pranshi_main";

    // --- LIVE DATA CONNECTORS ---
    function initBank() {
        const balanceDisplay = document.getElementById('balance');
        const statusPill = document.getElementById('status');
        const historyContent = document.getElementById('history-content');

        // 1. Listen for Balance Changes
        db.ref(`users/${userId}/balance`).on('value', (snap) => {
            const val = snap.val();
            // Handle scientific notation and rounding
            const formattedBal = parseFloat(val || 0).toLocaleString('en-IN', {
                style: 'currency',
                currency: 'INR',
                minimumFractionDigits: 2
            });
            
            balanceDisplay.innerText = formattedBal;
            
            // UI Update on Success
            statusPill.innerText = "● CENTRAL LEDGER LINKED";
            statusPill.style.color = ""; // Clear any previous dynamic error color overrides
            statusPill.classList.add('online');
        }, (err) => {
            statusPill.innerText = "X SYNC FAILED";
            statusPill.style.color = "#ff4444";
            console.error("Firebase Error:", err);
        });

        // 2. Listen for History Updates
        db.ref(`users/${userId}/history`).limitToLast(10).on('value', (snap) => {
            historyContent.innerHTML = '';
            let logs = [];
            
            snap.forEach(child => {
                logs.push(child.val());
            });

            if (logs.length === 0) {
                historyContent.innerHTML = '<div style="color:#444; font-size:13px; text-align:center; padding:20px;">No transaction history available.</div>';
                return;
            }

            // Show newest transactions at the top
            logs.reverse().forEach(data => {
                const isDebit = data.type === "DEBIT";
                const amountClass = isDebit ? "debit" : "credit";
                const symbol = isDebit ? "-" : "+";
                
                historyContent.innerHTML += `
                    <div class="item">
                        <div>
                            <div style="font-size:14px; font-weight:500;">${data.description || 'Transaction'}</div>
                            <div style="font-size:10px; color:#555;">${data.timestamp || ''}</div>
                        </div>
                        <div class="${amountClass}">${symbol}₹${Math.abs(data.amount || 0).toFixed(2)}</div>
                    </div>
                `;
            });
        }, (err) => {
            console.error("History sync execution failure:", err);
        });
    }

    // Run on Load
    window.onload = initBank;
</script>

</body>
</html>
